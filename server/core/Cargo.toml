[package]
name = "watchit-core"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
axum = "0.8.9"
r2d2 = "0.8.10"
r2d2_sqlite = "0.35.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread"] }
