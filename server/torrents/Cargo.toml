[package]
name = "watchit-torrents"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
bytes = "1.12.1"
fs4 = "1.1.0"
futures = "0.3.34"
librqbit = "9.0.1"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["json"] }
rusqlite = "0.40.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tracing = "0.1.44"
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }
watchit-core = { version = "0.1.0", path = "../core" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
