[package]
name = "watchit-server"
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "watchit-server"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
form_urlencoded = "1.2.2"
tokio = { version = "1.53.3", features = ["full"] }
tokio-util = "0.7.20"
tower = { version = "0.5.3", default-features = false }
tower-http = { version = "0.7.1", features = ["compression-br", "compression-gzip", "fs", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ts-rs = "12.0.1"
watchit-artwork = { version = "0.1.0", path = "../artwork" }
watchit-catalog = { version = "0.1.0", path = "../catalog" }
watchit-core = { version = "0.1.0", path = "../core" }
watchit-library = { version = "0.1.0", path = "../library" }
watchit-playback = { version = "0.1.0", path = "../playback" }
watchit-profiles = { version = "0.1.0", path = "../profiles" }
watchit-torrents = { version = "0.1.0", path = "../torrents" }
watchit-remote = { version = "0.1.0", path = "../remote" }
async-trait = "0.1.92"
