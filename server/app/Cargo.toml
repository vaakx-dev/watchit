[package]
name = "watchit-server"
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "watchit-server"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
tokio = { version = "1.53.3", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
watchit-core = { version = "0.1.0", path = "../core" }
