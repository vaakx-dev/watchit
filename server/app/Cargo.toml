[package]
name = "watchit-server"
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "watchit-server"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
form_urlencoded = "1.2.2"
tokio = { version = "1.53.3", features = ["full"] }
tokio-util = "0.7.20"
tower = { version = "0.5.3", default-features = false }
tower-http = { version = "0.7.1", features = ["compression-br", "compression-gzip", "fs", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
ts-rs = "12.0.1"
watchit-core = { version = "0.1.0", path = "../core" }
watchit-profiles = { version = "0.1.0", path = "../profiles" }
watchit-remote = { version = "0.1.0", path = "../remote" }
