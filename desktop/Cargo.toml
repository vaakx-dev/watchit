[package]
name = "watchit-desktop"
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "watchit"
path = "src/main.rs"

[build-dependencies]
cc = "1"
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
anyhow = "1.0.104"
libmpv2 = "6"
serde_json = "1"
tokio = { version = "1.53.3", features = ["time"] }
tauri = { version = "=2.12.4", features = ["unstable", "tray-icon"] }
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-single-instance = "=2.5.4"
tauri-plugin-updater = "=2.14.0"
watchit-server = { version = "0.1.0", path = "../server/app" }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Devices_Display", "Win32_Graphics_Gdi"] }
