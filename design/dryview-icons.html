<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dryview icons</title><style>*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}main{max-width:1080px;margin:auto;padding:32px 24px 48px}h1{font-size:22px;margin:0 0 8px}p{font-size:13px;color:#aaa;margin:0;line-height:1.5}h2{font-size:15px;margin:32px 0 0;padding-bottom:14px;border-bottom:1px solid #333}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:20px 14px;padding-top:18px}figure{margin:0;text-align:center}.preview{height:90px;display:flex;align-items:center;justify-content:center}svg{width:56px;height:56px;display:block;fill:currentColor}figcaption{font:12px monospace;color:#bbb;overflow-wrap:anywhere}.note{margin-top:28px}@media(max-width:480px){main{padding:24px 16px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 10px}.preview{height:72px}svg{width:46px;height:46px}figcaption{font-size:10px}}</style></head><body><main><h1>Dryview icons</h1><p>All 19 original SVG files, assembled status eyes, and IT variants A and B.</p><section><h2>Navigation</h2><div class="grid"><figure><div class="preview"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" id="nav-browse" viewBox="0 0 24 24"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zm3.5-12.5-2 5-5 2 2-5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div><figcaption>nav-browse</figcaption></figure><figure><div class="preview"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" id="nav-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21h-6v-6h-6v6H3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div><figcaption>nav-home</figcaption></figure><figure><div class="preview"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" id="nav-lists" viewBox=" ill="currentColor"/></svg></div><figcaption>Watched</figcaption></figure><figure><div class="preview"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 9h2v6H9zM13 9h2v6h-2z" fill="currentColor"/></svg></div><figcaption>Paused</figcaption></figure><figure><div class="preview"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 16.8l-4.4-4.4a2.7 2.7 0 1 1 3.8-3.8l.6.6.6-.6a2.7 2.7 0 1 1 3.8 3.8z" fill="currentColor"/></svg></div><figcaption>Favorite</figcaption></figure><figure><div class="preview"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" id="eye-dropped" viewBox="0 0 24 24"><path d="M3 14c2.5 2.5 5.5 4 9 4s6.5-1.5 9-4" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M6.5 17l-1.5 2.5M12 18v3M17.5 17l1.5 2.5" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"/></svg></div><figcaption>Dropped</figcaption></figure></div></section><section><h2>IT eyes</h2><div class="grid"><figure><div class="preview"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/><path d="M8.1 8.8h1.65v6.4H8.1zM11.15 8.8h5.2v1.55h-1.78v4.85h-1.65v-4.85h-1.77z"/></svg></div><figcaption>A · Upright</figcaption></figure><figure><div class="preview"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(1.69 0) skewX(-8)"><path d="M8.1 8.8h1.65v6.4
